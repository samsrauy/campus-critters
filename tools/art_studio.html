<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Critters · Art Studio</title>
<style>
  :root { --bg:#141418; --panel:#1f1f26; --line:#33333d; --ink:#ececf1; --dim:#9a9aa6; --gold:#f2c14e; --mana:#cfd6ff; --tc:#9aa0aa; --ok:#5fd68a; --bad:#ff7a6e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:2px solid var(--gold); background:#0d0d10; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:19px; color:var(--gold); }
  header .progress { margin-left:auto; display:flex; align-items:center; gap:10px; color:var(--dim); font-size:13px; }
  .bar { width:140px; height:8px; background:var(--line); border-radius:5px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--gold); }
  .wrap { display:grid; grid-template-columns:290px 1fr; min-height:calc(100vh - 54px); }
  aside { border-right:1px solid var(--line); padding:12px; overflow:auto; max-height:calc(100vh - 54px); position:sticky; top:54px; }
  aside input[type=search] { width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:14px; }
  .filters { display:flex; gap:6px; margin:8px 0 4px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:transparent; color:var(--dim); border-radius:20px; padding:3px 10px; font-size:12px; cursor:pointer; }
  .chip.on { background:var(--gold); color:#111; border-color:var(--gold); font-weight:700; }
  .fac { margin-top:12px; }
  .fac h3 { margin:0 0 4px; font-size:13px; letter-spacing:.03em; display:flex; justify-content:space-between; }
  .item { display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:6px 7px; border-radius:8px; border:1px solid transparent; background:transparent; color:var(--ink); cursor:pointer; font-size:14px; }
  .item:hover { background:var(--panel); }
  .item.sel { background:var(--panel); border-color:var(--tc); }
  .thumb { width:34px; height:34px; border-radius:6px; flex:none; display:grid; place-items:center; font-size:20px; background:color-mix(in srgb,var(--tc) 22%,transparent); overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .item .nm { flex:1; line-height:1.2; }
  .item .nm small { display:block; color:var(--dim); font-size:11px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--line); flex:none; }
  .dot.has { background:var(--ok); }
  main { padding:18px 22px 40px; }
  .empty { max-width:560px; margin:60px auto; text-align:center; color:var(--dim); }
  .empty h2 { color:var(--ink); }
  .title { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .title h2 { margin:0; font-size:22px; }
  .tag { font-size:12px; padding:2px 9px; border-radius:20px; border:1px solid var(--tc); color:var(--tc); }
  .cols { display:grid; grid-template-columns:minmax(300px,440px) minmax(260px,1fr); gap:24px; align-items:start; }
  .step { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .step h4 { margin:0 0 8px; font-size:14px; color:var(--gold); }
  .step h4 b { display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; background:var(--gold); color:#111; font-size:12px; margin-right:6px; }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:26px 12px; text-align:center; color:var(--dim); cursor:pointer; }
  .drop.over { border-color:var(--gold); color:var(--gold); }
  .drop strong { color:var(--ink); }
  .stage { position:relative; width:100%; aspect-ratio:1; border-radius:10px; overflow:hidden; background:#000; touch-action:none; cursor:grab; }
  .stage:active { cursor:grabbing; }
  .stage canvas { width:100%; height:100%; display:block; }
  .guide { position:absolute; inset:10%; border:1.5px dashed rgba(255,255,255,.7); border-radius:6px; pointer-events:none; }
  .guide span { position:absolute; top:-21px; left:0; font-size:11px; color:#fff; background:rgba(0,0,0,.55); padding:1px 6px; border-radius:4px; }
  .zoom { display:flex; align-items:center; gap:10px; margin-top:10px; font-size:13px; color:var(--dim); }
  .zoom input { flex:1; accent-color:var(--gold); }
  .note { font-size:13px; margin-top:8px; padding:7px 10px; border-radius:8px; }
  .note.warn { background:#3a2c10; color:#ffd88a; }
  .note.good { background:#12301d; color:#9df0b8; }
  .note.bad { background:#3a1614; color:#ffb3ab; }
  label.f { display:block; font-size:13px; color:var(--dim); margin:10px 0 4px; }
  label.f:first-of-type { margin-top:0; }
  input[type=text], textarea { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:#17171c; color:var(--ink); font:inherit; }
  textarea { min-height:74px; resize:vertical; }
  .check { display:flex; gap:9px; align-items:flex-start; margin-top:10px; font-size:14px; }
  .check input { margin-top:3px; width:17px; height:17px; accent-color:var(--gold); flex:none; }
  .count { text-align:right; font-size:11px; color:var(--dim); }
  .btn { border:0; border-radius:10px; padding:11px 18px; font:700 15px system-ui; cursor:pointer; }
  .btn.primary { background:var(--gold); color:#111; width:100%; margin-top:12px; }
  .btn.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); padding:6px 12px; font-size:13px; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .cols > div:last-child { position:sticky; top:70px; }
  .previews { display:flex; gap:22px; align-items:flex-end; flex-wrap:wrap; }
  .previews figure { margin:0; text-align:center; }
  .previews figcaption { font-size:12px; color:var(--dim); margin-top:6px; }
  /* card face: same as the game */
  .card { position:relative; border:3px solid var(--tc); border-radius:12px; background:linear-gradient(160deg,#2b2b33,#1b1b20);
    padding:6px; display:flex; flex-direction:column; gap:3px; min-height:160px; width:112px; user-select:none; text-align:left; }
  .card .ctop { display:flex; justify-content:space-between; align-items:center; font-size:10px; color:var(--tc); font-weight:700; }
  .card .cost { background:var(--mana); color:#001; border-radius:10px; padding:1px 6px; font-size:12px; }
  .card .art { font-size:40px; text-align:center; line-height:1.25; background:color-mix(in srgb,var(--tc) 18%,transparent); border-radius:8px; }
  .card .art.img { padding:0; overflow:hidden; line-height:0; }
  .card .art.img img { width:100%; aspect-ratio:1; object-fit:cover; display:block; border-radius:8px; }
  .card .cname { font-size:12px; font-weight:700; line-height:1.15; min-height:28px; }
  .card .cname small { display:block; font-weight:400; color:var(--dim); font-size:10px; }
  .card .stats { display:flex; justify-content:space-between; font-size:12px; }
  .card.big { width:190px; padding:9px; border-radius:16px; }
  .card.big .ctop { font-size:13px; } .card.big .cname { font-size:17px; } .card.big .cname small { font-size:13px; } .card.big .stats { font-size:15px; }
  .card.legend { box-shadow:0 0 13px 3px #ff5fd2; }
  .boss { width:150px; height:150px; border-radius:50%; border:4px solid var(--tc); overflow:hidden; display:grid; place-items:center; font-size:64px; background:color-mix(in srgb,var(--tc) 18%,#111); }
  .boss img { width:100%; height:100%; object-fit:cover; }
  .current { font-size:13px; color:var(--dim); margin-top:14px; }
  .current b { color:var(--ink); }
  details { margin-top:14px; font-size:13px; color:var(--dim); }
  details summary { cursor:pointer; color:var(--ink); }
  details li { margin:4px 0; }
  pre.log { background:#0d0d10; padding:8px; border-radius:8px; font-size:12px; white-space:pre-wrap; max-height:150px; overflow:auto; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#222; border:1px solid var(--gold); padding:11px 18px; border-radius:10px; z-index:20; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  @media (max-width:860px) { .cols > div:last-child { position:static; } .wrap { grid-template-columns:1fr; } aside { position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line); } .cols { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>🎨 Campus Critters Art Studio</h1>
  <div class="progress"><span id="prog">…</span><div class="bar"><i id="progbar" style="width:0"></i></div></div>
</header>
<div class="wrap">
  <aside>
    <input type="search" id="q" placeholder="Find a card…" aria-label="Find a card">
    <div class="filters" role="group" aria-label="Show">
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="need">Needs art</button>
      <button class="chip" data-f="has">Has art</button>
      <button class="chip" data-f="boss">Bosses</button>
    </div>
    <div id="list"></div>
  </aside>
  <main id="main">
    <div class="empty">
      <h2>Pick a card on the left to start</h2>
      <p>Green dots have art already. Grey dots are waiting for yours.</p>
      <p>You'll add a picture, crop it to a square, and say who made it. The game picks it up as soon as you press Save.</p>
    </div>
  </main>
</div>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DATA = null, SEL = null, FILTER = 'all';
const ed = { img:null, name:'', scale:1, min:1, ox:0, oy:0, legendary:false };
const VIEW = 600, OUT = 1024, MIN_SRC = 1024;

async function loadCatalog() {
  const r = await fetch('/api/catalog'); DATA = await r.json(); renderList(); renderProgress();
}
const allItems = () => DATA.factions.flatMap(f => [...f.cards, ...f.bosses].map(c => ({ ...c, fac:f })));
const artOf = (id, leg) => DATA.art[leg ? id + '.legendary' : id];

function renderProgress() {
  const cards = DATA.factions.flatMap(f => f.cards), done = cards.filter(c => artOf(c.id)).length;
  $('#prog').textContent = `${done} of ${cards.length} cards have art`;
  $('#progbar').style.width = (100 * done / cards.length) + '%';
}

function renderList() {
  const q = $('#q').value.trim().toLowerCase();
  $('#list').innerHTML = DATA.factions.map(f => {
    const rows = [...f.cards, ...f.bosses].filter(c => {
      const has = !!artOf(c.id), boss = c.kind !== 'card';
      if (q && !c.name.toLowerCase().includes(q)) return false;
      if (FILTER === 'need') return !has && !boss;
      if (FILTER === 'has') return has;
      if (FILTER === 'boss') return boss;
      return true;
    });
    if (!rows.length) return '';
    return `<div class="fac" style="--tc:${f.color}"><h3 style="color:${f.color}"><span>${f.icon} ${f.key}</span></h3>` +
      rows.map(c => { const a = artOf(c.id);
        return `<button class="item ${SEL && SEL.id === c.id ? 'sel' : ''}" data-id="${c.id}">
          <span class="thumb">${a ? `<img src="/${a.small}" alt="">` : c.emoji}</span>
          <span class="nm">${esc(c.name)}${c.kind !== 'card' ? `<small>${c.kind === 'guardian' ? 'Guardian' : 'Well Keeper'}</small>` : ''}</span>
          <span class="dot ${a ? 'has' : ''}" title="${a ? 'Has art' : 'Needs art'}"></span></button>`; }).join('') + '</div>';
  }).join('') || '<p class="dim" style="color:var(--dim)">Nothing matches.</p>';
}

$('#list').addEventListener('click', e => { const b = e.target.closest('.item'); if (b) select(b.dataset.id); });
$('#q').addEventListener('input', renderList);
document.querySelector('.filters').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  FILTER = b.dataset.f; document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); renderList();
});

function select(id) {
  SEL = allItems().find(c => c.id === id); ed.img = null; ed.legendary = false;
  renderList(); renderMain();
}

function cardFace(c, src, big) {
  const place = c.kind === 'card' ? c.fac.place : (c.kind === 'guardian' ? 'Guardian' : 'Well Keeper');
  return `<div class="card ${big ? 'big' : ''} ${ed.legendary ? 'legend' : ''}" style="--tc:${c.fac.color}">
    <div class="ctop"><span class="cost">2</span><span>${c.fac.icon} ${c.fac.key}</span></div>
    <div class="art ${src ? 'img' : ''}">${src ? `<img src="${src}" alt="">` : c.emoji}</div>
    <div class="cname">${esc(c.name)}<small>${esc(place)}</small></div>
    <div class="stats"><span>⚔️ 6</span><span>${ed.legendary ? '★★★' : '★'}</span></div></div>`;
}
function bossFace(c, src) {
  return `<div class="boss" style="--tc:${c.fac.color}">${src ? `<img src="${src}" alt="">` : c.emoji}</div>`;
}

function renderMain() {
  const c = SEL, isCard = c.kind === 'card';
  const cur = artOf(c.id, ed.legendary), credit = DATA.credits[ed.legendary ? c.id + '.legendary' : c.id];
  $('#main').innerHTML = `
    <div class="title" style="--tc:${c.fac.color}"><h2>${c.emoji} ${esc(c.name)}</h2>
      <span class="tag">${c.fac.icon} ${c.fac.key} ${isCard ? 'card' : c.kind === 'guardian' ? 'guardian' : 'Well Keeper'}</span></div>
    ${!isCard ? `<div class="note warn" style="margin-bottom:14px">The game doesn't show ${c.kind === 'guardian' ? 'guardian' : 'Well Keeper'} art yet. You can still add it now, and it will appear once that's built.</div>` : ''}
    <div class="cols">
      <div>
        <div class="step"><h4><b>1</b>Your picture</h4>
          <div class="drop" id="drop" tabindex="0" role="button"><strong>Drop a picture here</strong><br>or click to choose one<br><small>PNG or JPG, at least 1024 × 1024 pixels</small></div>
          ${isCard ? `<label class="check"><input type="checkbox" id="leg" ${ed.legendary ? 'checked' : ''}><span>This is the <b>legendary</b> version (a special picture for the rarest copy of this card)</span></label>` : ''}
        </div>
        <div class="step" id="cropStep" hidden><h4><b>2</b>Crop it</h4>
          <div class="stage" id="stage"><canvas id="cv" width="${VIEW}" height="${VIEW}"></canvas><div class="guide"><span>Keep the main subject inside this box</span></div></div>
          <div class="zoom"><span>Zoom</span><input type="range" id="zoom" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><button class="btn ghost" id="reset">Reset</button></div>
          <div class="note" id="res"></div>
          <div style="font-size:12px;color:var(--dim);margin-top:6px">Drag the picture to move it. Scroll or use the slider to zoom.</div>
        </div>
        <div class="step" id="creditStep" hidden><h4><b>3</b>Your credit</h4>
          <label class="f" for="artist">Your name, as it should appear on the card</label>
          <input type="text" id="artist" maxlength="80" value="${esc(credit?.artist || localStorage.getItem('artist') || '')}" placeholder="e.g. Jordan Lee">
          <label class="f" for="alt">Describe the picture for someone who can't see it</label>
          <textarea id="alt" maxlength="250" placeholder="e.g. A pothole full of rainwater with two glowing eyes peeking out.">${esc(credit?.alt || '')}</textarea>
          <div class="count"><span id="altn">0</span>/250</div>
          <label class="check"><input type="checkbox" id="agree"><span>I made this picture, it has no words in it, and my signed art agreement is with the art lead.</span></label>
          <button class="btn primary" id="save" disabled>Save to the game</button>
          <div id="result"></div>
        </div>
      </div>
      <div>
        <div class="step"><h4>Preview</h4>
          <div class="previews" id="prev"></div>
          <div class="current">${cur ? `Current art by <b>${esc(cur.artist)}</b>. Saving will replace it.` : 'No art yet. The game shows the emoji until someone adds a picture.'}</div>
        </div>
        <details><summary>Art guidelines</summary><ul>
          <li>Square, at least 1024 × 1024 pixels. Bigger is fine; the studio shrinks it.</li>
          <li>No words, letters or numbers in the picture. The game adds the name.</li>
          <li>Keep the subject inside the dashed box. The edges can get trimmed on small screens.</li>
          <li>It should read at thumbnail size: one clear subject, strong shapes, good contrast.</li>
          <li>Your own work only. AI can help you explore ideas, but the final picture has to be made by you.</li>
          <li>Legendary versions are optional: a fancier take on the same character.</li>
        </ul></details>
      </div>
    </div>`;
  const drop = $('#drop');
  drop.onclick = () => $('#file').click();
  drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#file').click(); } };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) loadFile(f); };
  const leg = $('#leg'); if (leg) leg.onchange = () => { ed.legendary = leg.checked; const keep = ed.img; renderMain(); if (keep) { ed.img = keep; showEditor(true); } };
  updatePreview();
}

$('#file').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(f); e.target.value = ''; });
document.addEventListener('paste', e => { if (!SEL) return; const it = [...e.clipboardData.items].find(i => i.type.startsWith('image/')); if (it) loadFile(it.getAsFile()); });

function loadFile(f) {
  if (!/^image\//.test(f.type)) return toast('That file is not a picture.');
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => { ed.img = im; ed.name = f.name; showEditor(false); };
  im.onerror = () => toast('That picture could not be opened. Try a PNG or JPG.');
  im.src = url;
}

function showEditor(keepView) {
  $('#cropStep').hidden = false; $('#creditStep').hidden = false;
  const im = ed.img;
  ed.min = VIEW / Math.min(im.naturalWidth, im.naturalHeight);
  if (!keepView) { ed.scale = ed.min; ed.ox = (VIEW - im.naturalWidth * ed.scale) / 2; ed.oy = (VIEW - im.naturalHeight * ed.scale) / 2; }
  $('#zoom').value = ed.scale / ed.min;
  wireEditor(); draw(); validate();
}

function clamp() {
  const im = ed.img, w = im.naturalWidth * ed.scale, h = im.naturalHeight * ed.scale;
  ed.ox = Math.min(0, Math.max(VIEW - w, ed.ox)); ed.oy = Math.min(0, Math.max(VIEW - h, ed.oy));
}
function zoomTo(z, cx = VIEW / 2, cy = VIEW / 2) {
  const s = ed.min * Math.max(1, Math.min(4, z)), k = s / ed.scale;
  ed.ox = cx - (cx - ed.ox) * k; ed.oy = cy - (cy - ed.oy) * k; ed.scale = s; clamp();
  $('#zoom').value = s / ed.min; draw();
}
function wireEditor() {
  const st = $('#stage'); let drag = null;
  const pt = e => { const r = st.getBoundingClientRect(); return [(e.clientX - r.left) * VIEW / r.width, (e.clientY - r.top) * VIEW / r.height]; };
  st.onpointerdown = e => { st.setPointerCapture(e.pointerId); const [x, y] = pt(e); drag = { x, y, ox:ed.ox, oy:ed.oy }; };
  st.onpointermove = e => { if (!drag) return; const [x, y] = pt(e); ed.ox = drag.ox + x - drag.x; ed.oy = drag.oy + y - drag.y; clamp(); draw(); };
  st.onpointerup = st.onpointercancel = () => { drag = null; };
  st.onwheel = e => { e.preventDefault(); const [x, y] = pt(e); zoomTo(ed.scale / ed.min * (e.deltaY < 0 ? 1.08 : 1 / 1.08), x, y); };
  $('#zoom').oninput = e => zoomTo(+e.target.value);
  $('#reset').onclick = () => showEditor(false);
  ['artist', 'alt', 'agree'].forEach(id => $('#' + id).oninput = $('#' + id).onchange = validate);
  $('#save').onclick = save;
}

function render(size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), k = size / VIEW;
  g.imageSmoothingQuality = 'high';
  g.drawImage(ed.img, ed.ox * k, ed.oy * k, ed.img.naturalWidth * ed.scale * k, ed.img.naturalHeight * ed.scale * k);
  return c;
}
let prevTimer = null;
function draw() {
  const g = $('#cv').getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, VIEW, VIEW);
  g.drawImage(ed.img, ed.ox, ed.oy, ed.img.naturalWidth * ed.scale, ed.img.naturalHeight * ed.scale);
  const src = Math.round(VIEW / ed.scale), res = $('#res');
  if (src >= MIN_SRC) { res.className = 'note good'; res.textContent = `Looks sharp: this crop is ${src} × ${src} pixels.`; }
  else { res.className = 'note warn'; res.textContent = `This crop is only ${src} × ${src} pixels, so it may look soft. Zoom out, or use a bigger picture if you have one.`; }
  clearTimeout(prevTimer); prevTimer = setTimeout(updatePreview, 60);
}
function updatePreview() {
  const c = SEL, cur = artOf(c.id, ed.legendary);
  const src = ed.img ? render(256).toDataURL('image/png') : (cur ? '/' + cur.small : null);
  $('#prev').innerHTML = c.kind === 'card'
    ? `<figure>${cardFace(c, src, false)}<figcaption>In your collection</figcaption></figure><figure>${cardFace(c, src, true)}<figcaption>Card details</figcaption></figure>`
    : `<figure>${bossFace(c, src)}<figcaption>On the map</figcaption></figure>`;
}

function validate() {
  const n = $('#alt').value.length; $('#altn').textContent = n;
  $('#save').disabled = !(ed.img && $('#artist').value.trim() && $('#alt').value.trim() && $('#agree').checked);
}

async function save() {
  const btn = $('#save'); btn.disabled = true; btn.textContent = 'Saving…';
  localStorage.setItem('artist', $('#artist').value.trim());
  const body = { id:SEL.id, legendary:ed.legendary, artist:$('#artist').value.trim(), alt:$('#alt').value.trim(),
    agreement:$('#agree').checked, png:render(OUT).toDataURL('image/png') };
  let out;
  try { const r = await fetch('/api/save', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body) }); out = await r.json(); }
  catch (e) { out = { error:'Could not reach the studio. Is the studio window still open?' }; }
  btn.textContent = 'Save to the game';
  if (out.ok) {
    const keepLeg = ed.legendary; await loadCatalog(); SEL = allItems().find(c => c.id === SEL.id); ed.img = null; ed.legendary = keepLeg; renderMain();
    toast(`Saved! ${SEL.name} now has your art.`);
  } else {
    btn.disabled = false;
    $('#result').innerHTML = `<div class="note bad">${esc(out.error || 'Something went wrong while building the art.')}</div>${out.log ? `<details><summary>Details for the art lead</summary><pre class="log">${esc(out.log)}</pre></details>` : ''}`;
  }
}

function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 3200); }
loadCatalog().catch(() => { $('#main').innerHTML = '<div class="empty"><h2>The studio can\'t find the game files.</h2><p>Start it from the campus-critters folder with <code>python3 tools/art_studio.py</code>.</p></div>'; });
</script>
</body>
</html>
