  .page { position:absolute; inset:0; overflow:auto; padding:12px; background:var(--bg); z-index:900; }

  .card .ab { font-size:11px; color:var(--dim); }

  .card.r3 { box-shadow:0 0 13px 3px #ff5fd2; }

  .card.tired { opacity:.5; }

<h2>🪶 History beneath the game</h2>
<p class="dim">This page isn't part of the game. Nothing here earns mana, cards or points. It's here because this game is played on real land with a real history, at a school.</p>

<h3>Whose land is this?</h3>
<p>Oakland University stands on the ancestral, traditional and present-day lands of the <b>Anishinaabe</b>: the Three Fires Confederacy of the <b>Ojibwe, Odawa and Potawatomi</b> peoples. OU affirms this in its Land Acknowledgement Statement, which also recognizes the sovereignty of Michigan's tribal nations. These are living nations. Southeast Michigan is home to one of the largest urban Native American populations in the country.</p>

<h3>How the land changed hands</h3>
<p>On Nov. 17, 1807, William Hull, governor of the Michigan Territory, signed the <b>Treaty of Detroit</b> with leaders of the Odawa, Ojibwe, Potawatomi and Wyandot nations. Under the treaty, the nations ceded roughly the southeast quarter of Michigan's Lower Peninsula, including the land under this campus, to the United States. OU's own leadership has named this treaty as the cession that covers the campus.</p>
<p>Like many treaties of its era, it was signed under heavy pressure. Reporting on OU's heritage site describes the Anishinaabe as having been forced to sign, for about two cents an acre.</p>

<h3>Names on the map</h3>
<p>The city next door, <b>Pontiac</b>, is named for <b>Obwandiyag</b>, an Odawa leader who was likely born along the Detroit River. In 1763 he led a war against British occupation of the Great Lakes region that began with a siege of Fort Detroit. A car brand later took its name from the city.</p>

<h3>What OU has done, and what people are still asking for</h3>
<p>OU adopted its Land Acknowledgement in 2021 and marked it with a plaque in April 2022. That month it also dedicated a Native American heritage site on south campus named <b>Gidinawemaaganinaanig: Endazhigiyang</b>, which is Anishinaabemowin for "All Our Relations: The Place Where We All Grow." It's called Gitigan, "garden," for short. The site is stewarded by OU's Native American Advisory Committee, and news coverage reported it as the first U.S. campus to return land use to a Native community.</p>
<p>The faculty who drove this work have said that a statement alone isn't enough. They've called for ongoing commitments, such as an endowment for the heritage site.</p>
<p><b>The heritage site is deliberately not part of this game.</b> There are no wells, packs or guardians there. If you visit, go as a guest.</p>

<h3>Close to campus: 1971</h3>
<p>On Aug. 30, 1971, days before court-ordered busing was set to desegregate Pontiac's schools, Ku Klux Klan members dynamited 10 empty school buses in the Pontiac school district's depot. Six local Klansmen were arrested, and five were convicted, including the state Klan leader. The bombing made Pontiac a national flashpoint in the fight over school desegregation, It happened just a few miles from this campus.</p>

/* =====================================================================
   SEEDED RANDOMNESS — same square + same time window = same pack for everyone
   ===================================================================== */
function hashStr(str){ let h = 1779033703 ^ str.length;
  for (let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; }
  h = Math.imul(h ^ h>>>16, 2246822507); h = Math.imul(h ^ h>>>13, 3266489909); return (h ^= h>>>16) >>> 0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rngFrom = s => mulberry32(hashStr(s));
const pick = (r,arr) => arr[Math.floor(r()*arr.length)];
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rollRarity(r){ const x=r(); return x<0.01?3 : x<0.08?2 : x<0.30?1 : 0; }
function makeCard(r, type, rar){
  const [emoji,noun] = pick(r, CREATURES[type]), adj = pick(r, ADJ[type]);
  const cost = 1 + Math.floor(r()*3);
  const ab = r() < 0.25 + 0.2*rar ? pick(r, ABIL_KEYS) : null;
  const pow = 1 + cost*2 + rar + Math.floor(r()*2) - (ab?1:0);
  return { type, rar, emoji, name:adj+' '+noun, cost, pow, ab };
}

let S = { cards:[], deck:[], tired:{}, raids:{}, lastRegen:0, mana:null, artifact:null, warden:null, wells:{}, opened:{}, guardians:{}, lastTick:0, news:[], mode:'gps', nextId:1,
          seenHelp:false, siteOverrides:{}, editor:false, summoned:0, toppled:0, started:false };
function load(){ try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s) S = Object.assign(S, s); } catch(e){}
  if (!S.mana || typeof S.mana!=='object'){ S.mana = { Colorless:0 }; TYPE_KEYS.forEach(t => S.mana[t] = 2); } }
const tiredLeft = uid => Math.max(0, (S.tired[uid]||0) - Date.now());
const inSiege = () => B && !B.over;
const canPay = c => S.mana[c.type] + S.mana.Colorless + (inSiege() ? B.surge : 0) >= c.cost;
function pay(type, cost){ let left = cost; const a = Math.min(S.mana[type], left); S.mana[type] -= a; left -= a;
  if (inSiege()){ const b = Math.min(B.surge, left); B.surge -= b; left -= b; }
  S.mana.Colorless -= left; return left; }
function manaRegen(){ const step = MANA_REGEN_MIN*60000; if (!S.lastRegen) S.lastRegen = Date.now();
  const n = Math.min(MANA_REGEN_CAP, Math.floor((Date.now()-S.lastRegen)/step)); if (n<=0) return;
  S.lastRegen += Math.floor((Date.now()-S.lastRegen)/step)*step;
  TYPE_KEYS.forEach(t => { if (S.mana[t] < MANA_REGEN_CAP) S.mana[t] = Math.min(MANA_REGEN_CAP, S.mana[t] + n); }); }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){} hud(); }
function addCard(c, origin){ const card = Object.assign({}, c, { uid:S.nextId++, origin, got:new Date().toLocaleDateString('en-CA') });
  S.cards.push(card); if (S.deck.length < DECK_MAX) S.deck.push(card.uid); return card; }
function news(text){ S.news.unshift({ t:Date.now(), text }); S.news = S.news.slice(0,50); }

/* =====================================================================
   GEOMETRY
   ===================================================================== */
const cellOf = (lat,lng) => [Math.floor(lat/CELL_LAT), Math.floor(lng/CELL_LNG)];
const cellId = (i,j) => i+':'+j;
const cellBounds = (i,j) => [[i*CELL_LAT, j*CELL_LNG], [(i+1)*CELL_LAT, (j+1)*CELL_LNG]];
const inCampus = (lat,lng) => lat>=CAMPUS.S && lat<=CAMPUS.N && lng>=CAMPUS.W && lng<=CAMPUS.E;
function distM(a,b,c,d){ const R=6371000, toR=Math.PI/180, dLat=(c-a)*toR, dLng=(d-b)*toR;
  const x=Math.sin(dLat/2)**2+Math.cos(a*toR)*Math.cos(c*toR)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
const fmtDist = m => m<1000 ? Math.round(m)+' m' : (m/1000).toFixed(1)+' km';
const fmtMin = ms => { const m = Math.ceil(ms/60000); return m<=1 ? 'under a minute' : m+' min'; };
const distToMe = (lat,lng) => me ? distM(me.lat,me.lng,lat,lng) : Infinity;
function esc(s){ return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

/* =====================================================================
   GUARDIANS — at most MAX_GUARDIANS on campus at once
   ===================================================================== */
function makeGuardian(type, owner, level){ const maxHp = 34 + 12*level;
  return { type, owner, level, maxHp, hp:maxHp, fort:0, since:Date.now(), upd:Date.now() }; }
const gName = t => T(t).guard[1];
const gEmoji = t => T(t).guard[0];
const guardianList = () => Object.entries(S.guardians).map(([id,g]) => ({ site:siteById(id), g })).filter(x => x.site);
function boostFor(type, site){ // potency: +1 per guardian of this faction on campus, +1 on its home turf
  return guardianList().filter(x => x.g.type===type).length + (site && site.aff===type ? 1 : 0); }
function nearestGuardian(lat,lng,maxM){ let best=null, bd=maxM;
  for (const {site,g} of guardianList()){ const d = distM(lat,lng,site.lat,site.lng); if (d<bd){ bd=d; best=g; } } return best; }
/* Elliott Tower: a colorless Bell Warden appears in random windows. Whoever topples it holds the Carillon. */
function wardenWindow(){ const ms = WARDEN_SLOT_MIN*60000, slot = Math.floor(Date.now()/ms), r = rngFrom('warden|'+slot), now = Date.now();
  const next = (slot+1)*ms;
  if (r() > WARDEN_CHANCE) return { slot, active:false, next };
  const start = slot*ms + r()*0.35*ms, end = start + (0.45+0.2*r())*ms;
  return { slot, start, end, next, active: now>=start && now<end, upcoming: now<start };
}
function currentWarden(){ const w = wardenWindow(); if (!w.active) return null;
  if (!S.warden || S.warden.slot!==w.slot) S.warden = { slot:w.slot, type:'Colorless', level:2, maxHp:56, hp:56, beaten:null, upd:Date.now(), end:w.end };
  return S.warden.beaten ? null : S.warden; }
const holderLabel = h => h==='you' ? 'You' : h ? T(h).icon+' '+h+' students' : 'Nobody';
function seedGuardians(){
  shuffle([...TYPE_KEYS]).slice(0, MAX_GUARDIANS).forEach(t => {
    const empty = SITES.filter(s => !S.guardians[s.id]), home = empty.filter(s => s.aff===t);
    const site = pick(Math.random, home.length ? home : empty);
    S.guardians[site.id] = makeGuardian(t, 'rival', 1 + (Math.random()<0.4 ? 1 : 0));
  });
}
function regenGuardians(){
  const step = GUARDIAN_REGEN_MIN*60000;
  for (const [id,g] of Object.entries(S.guardians)){ if (S.raids[id]){ g.upd = Date.now(); continue; } const n = Math.floor((Date.now()-g.upd)/step);
    if (n>0){ g.hp = Math.min(g.maxHp, g.hp + n*GUARDIAN_REGEN); g.upd += n*step; } }
}
/* Rival factions (AI stand-ins for other students) raid guardians on a timer */
function toppleBy(id, t, how){
  const g = S.guardians[id], site = siteById(id); delete S.guardians[id]; delete S.raids[id];
  const empties = SITES.filter(s => !S.guardians[s.id] && s.id!==id), home = empties.filter(s => s.aff===t);
  const dest = pick(Math.random, home.length ? home : empties);
  S.guardians[dest.id] = makeGuardian(t, 'rival', 1 + (Math.random()<0.4 ? 1 : 0));
  if (g.owner==='you'){ news(`💔 ${T(t).icon} ${t} students toppled YOUR ${gName(g.type)} at ${site.name}! Their ${gName(t)} rose at ${dest.name}.`); toast(`💔 Your guardian at ${site.name} fell!`); }
  else news(`📯 ${T(t).icon} ${t} students toppled the ${g.type} ${gName(g.type)} at ${site.name}${how||''}. A ${gName(t)} rose at ${dest.name}.`);
  return dest;
}
function processRaids(){
  const now = Date.now();
  for (const [id,r] of Object.entries(S.raids)){
    const g = S.guardians[id]; if (!g){ delete S.raids[id]; continue; }
    if (inSiege() && B.site.id===id){ r.last = now; continue; }   // you're in this raid: the live siege handles it
    r.acc += r.rate * (Math.min(now, r.end) - r.last); r.last = now;
    const d = Math.floor(r.acc); if (d>0){ g.hp = Math.max(0, g.hp - d); r.acc -= d; }
    if (g.hp<=0){ toppleBy(id, r.atk, ' in a raid'); continue; }
    if (now >= r.end){ delete S.raids[id];
      if (g.owner==='you'){ if (g.fort>0) g.fort--; news(`🛡️ Your ${gName(g.type)} at ${siteById(id).name} survived the ${r.atk} raid.`); }
      else news(`🛡️ The ${g.type} ${gName(g.type)} at ${siteById(id).name} drove off the ${r.atk} raid.`); }
  }
}
function rivalCatchUp(){
  const T = RIVAL_TICK_MIN*60000; let n = 0;
  while (Date.now()-S.lastTick >= T && n < 6){ S.lastTick += T; n++; rivalEvent(); }
  if (Date.now()-S.lastTick >= T) S.lastTick = Date.now();
  // An open slot with no summon pending (e.g. the page closed mid-summon) gets filled by a rival faction
  while (!pendingSummon && Object.keys(S.guardians).length < MAX_GUARDIANS){
    const held = new Set(Object.values(S.guardians).map(x => x.type)), t = pick(Math.random, TYPE_KEYS.filter(x => !held.has(x)));
    const empty = SITES.filter(s => !S.guardians[s.id]), home = empty.filter(s => s.aff===t), dest = pick(Math.random, home.length ? home : empty);
    S.guardians[dest.id] = makeGuardian(t, 'rival', 1); news(`📯 A ${t} ${gName(t)} rose at ${dest.name}.`);
  }
}
function rivalEvent(){
  const w = currentWarden();
  if (w && Math.random() < WARDEN_RIVAL_CHANCE){ const t = pick(Math.random, TYPE_KEYS); w.beaten = t;
    const lost = S.artifact && S.artifact.holder==='you'; S.artifact = { holder:t, since:Date.now() };
    news(`🔔 ${T(t).icon} ${t} students toppled the Bell Warden at Elliott Tower and seized the Carillon${lost ? ' from YOU' : ''}!`);
    if (lost) toast('🔔 You lost the Carillon!'); return; }
  const ids = Object.keys(S.guardians).filter(id => !S.raids[id]); if (!ids.length || Math.random() > RAID_START_CHANCE) return;
  const id = pick(Math.random, ids), g = S.guardians[id], site = siteById(id); if (!site) return;
  const held = new Set(Object.values(S.guardians).map(x => x.type));
  let cand = TYPE_KEYS.filter(t => t!==g.type && !held.has(t)); if (!cand.length) cand = TYPE_KEYS.filter(t => t!==g.type);
  const atk = pick(Math.random, cand), mins = RAID_MIN + Math.random()*(RAID_MAX-RAID_MIN);
  let total = g.hp * (0.6 + 0.8*Math.random());               // ~half of raids succeed on their own
  if (g.owner==='you') total *= (1 - 0.15*g.fort);           // fortification weakens raids on yours
  if (S.artifact && S.artifact.holder===atk) total *= 1 + ARTIFACT_RAID_BONUS*2;
  S.raids[id] = { atk, start:Date.now(), end:Date.now()+mins*60000, rate: total/(mins*60000), last:Date.now(), acc:0 };
  if (g.owner==='you'){ news(`🚨 ${T(atk).icon} ${atk} students are raiding YOUR ${gName(g.type)} at ${site.name}! Tend it to heal and fortify it.`); toast(`🚨 Your guardian at ${site.name} is under raid!`); }
  else news(`⚔️ ${T(atk).icon} ${atk} students are raiding the ${g.type} ${gName(g.type)} at ${site.name}. Join them, or steal the final blow.`);
}

/* =====================================================================
   PACKS — appear for a few minutes, then vanish. Guardians pull their faction's cards.
   ===================================================================== */
const packSlot = () => Math.floor(Date.now()/(PACK_SLOT_MIN*60000));
function packFor(i,j,slot){
  const id = cellId(i,j), r = rngFrom('pack|'+slot+'|'+id);
  const lat = (i+0.15+0.7*r())*CELL_LAT, lng = (j+0.15+0.7*r())*CELL_LNG;
  if (!inCampus(lat,lng)) return null;
  const g = nearestGuardian(lat,lng,GUARDIAN_PULL_M);
  if (r() > (g ? PACK_CHANCE_NEAR_GUARDIAN : PACK_CHANCE)) return null;
  const slotMs = PACK_SLOT_MIN*60000, start = slot*slotMs + r()*0.5*slotMs, end = start + (0.4+0.4*r())*slotMs;
  const cards = []; for (let k=0;k<PACK_SIZE;k++){ const type = g && r()<0.6 ? g.type : pick(r,TYPE_KEYS); cards.push(makeCard(r,type,rollRarity(r))); }
  return { id:slot+'|'+id, cell:id, lat, lng, start, end, cards, pull:g ? g.type : null };
}
function visiblePacks(){
  if (!me) return []; const [ci,cj] = cellOf(me.lat,me.lng), s = packSlot(), now = Date.now(), out = [];
  for (let di=-VIEW_RADIUS; di<=VIEW_RADIUS; di++) for (let dj=-VIEW_RADIUS; dj<=VIEW_RADIUS; dj++)
    for (const slot of [s-1,s]){ const p = packFor(ci+di,cj+dj,slot);
      if (p && now>=p.start && now<p.end && !S.opened[p.id]) out.push(p); }
  return out;
}
function prunePacks(){ const s = packSlot(); for (const k in S.opened) if (+k.split('|')[0] < s-1) delete S.opened[k]; }

    .addTo(siteLayer).bindTooltip('Elliott Tower', { permanent:true, direction:'bottom', offset:[0,22], className:'lmlabel' }).on('click', openTower);

function tryPack(p){

  openSheet(`<h2>🎁 Pack opened!</h2>${p.pull ? `<p class="dim">A nearby ${TYPES[p.pull].icon} ${p.pull} guardian drew its faction's critters here.</p>` : ''}

function drawMana(arg){
  const [id, chosen] = String(arg).split('|'), s = siteById(id);
  if (distToMe(s.lat,s.lng) > SITE_RANGE_M) return toast('Get closer to the well.');
  if (!wellReady(id)) return toast(`This well refills in ${fmtMin(WELL_COOLDOWN_MIN*60000-(Date.now()-S.wells[id]))}.`);
  const color = s.aff || chosen; if (!color) return;
  const g = S.guardians[id], bless = g && g.owner==='you' ? WELL_BLESS : 0;
  const give = Math.min((s.aff ? WELL_GIVE : COMMONS_GIVE) + bless, MANA_MAX - S.mana[color]);
  const art = S.artifact && S.artifact.holder==='you' ? Math.min(ARTIFACT_WELL_BONUS, COLORLESS_MAX - S.mana.Colorless) : 0;
  if (give<=0 && art<=0) return toast(`Your ${color} mana is already full (${MANA_MAX}).`);
  S.mana[color] += give; S.mana.Colorless += art; S.wells[id] = Date.now(); save(); renderSites();
  toast(`${T(color).icon} +${give} ${color} mana${bless ? ' (blessed)' : ''}${art ? ` · ◇ +${art} from the Carillon` : ''}`); openSite(id);
}
function tend(id){
  const g = S.guardians[id], s = siteById(id);
  if (distToMe(s.lat,s.lng) > SITE_RANGE_M) return toast('Get closer to your guardian.');
  if (S.mana[g.type] + S.mana.Colorless < TEND_COST) return toast(`Tending costs ${TEND_COST} ${g.type} mana.`);
  if (g.fort>=3 && g.hp>=g.maxHp) return toast('Fully fortified and healed.');
  pay(g.type, TEND_COST); if (S.raids[id]){ S.raids[id].rate *= 0.6; news(`🛡️ You tended your ${gName(g.type)} at ${siteById(id).name} mid-raid. The raid weakens.`); } g.fort = Math.min(3, g.fort+1); g.hp = g.maxHp; save(); renderSites();
  toast(`🛡️ Fortified (${g.fort}/3) and healed.`); openSite(id);
}

/* =====================================================================
   SIEGE — live raid battles. The guardian strikes on a timer at whoever holds
   its attention (threat). Computer-controlled students join with MMO roles.
   ===================================================================== */
const STRIKE_MS = 9000, STRIKE_MS_ENRAGED = 7000, DRAW_MS = 1800, WARD_PER_ALLY = 12;
const ROLES = {
  Tank:    { icon:'🛡️', types:['Might'],        every:6000, text:'Taunts the guardian to draw its strikes, and raises a shield' },
  Healer:  { icon:'💚', types:['Wild'],         every:4500, text:'Restores resolve to whoever is hurt worst' },
  DPS:     { icon:'⚔️', types:['Gear'],         every:5000, text:'Deals steady damage' },
  Support: { icon:'📣', types:['Lore','Muse'],  every:5500, text:'Jams the next strike or boosts your next card' },
};
let B = null, siegeLoop = null;
function effPow(c){ const g = B.g; let p = c.pow + boostFor(c.type, B.site);
  if (TYPES[c.type].beats===g.type) p += 2; if (T(g.type).beats===c.type) p -= 1; return Math.max(1,p); }
const rollIntent = g => 3 + g.level*2 + Math.floor(Math.random()*3);
function drawOne(){ if (!B.draw.length){ if (!B.discard.length) return; B.draw = shuffle(B.discard); B.discard = []; } B.hand.push(B.draw.pop()); B.handDirty = true; }
const phaseOf = g => g.hp <= g.maxHp*0.25 ? 3 : g.hp <= g.maxHp*0.5 ? 2 : 1;
const alive = () => [B.me, ...B.party].filter(p => p.resolve > 0);
function blog(t){ B.log.unshift(t); B.log = B.log.slice(0,30); B.logDirty = true; }

function challenge(id){
  const all = S.deck.map(u => S.cards.find(c => c.uid===u)).filter(Boolean), deck = all.filter(c => !tiredLeft(c.uid));
  if (all.length < DECK_MIN) return toast(`You need at least ${DECK_MIN} cards in your deck (🃏 Cards tab).`);
  if (deck.length < DECK_MIN){ const soon = Math.min(...all.filter(c => tiredLeft(c.uid)).map(c => tiredLeft(c.uid)));
    return toast(`Only ${deck.length} rested cards. You need ${DECK_MIN}. Swap in fresh cards, or wait ${fmtMin(soon)}.`); }
  if (!deck.some(canPay)) return toast('You can\'t afford any card in your deck. Visit wells that match your cards\' colors.');
  const s = siteById(id), g = id==='tower' ? currentWarden() : S.guardians[id];
  if (!g) return toast('Nothing to fight here right now.');
  // Computer-controlled students answer the call: 2–3 of them, each in a role
  const raid = S.raids[id], n = raid ? 4 : 2 + (Math.random()<0.5 ? 1 : 0), now = Date.now();
  const party = shuffle(Object.keys(ROLES)).slice(0,n).map((role,i) => {
    const R = ROLES[role], type = raid ? raid.atk : pick(Math.random, R.types.filter(t => t!==g.type).length ? R.types.filter(t => t!==g.type) : R.types);
    const c = makeCard(Math.random, type, 1);
    return { id:'a'+i, name:c.name, emoji:c.emoji, type, role, resolve:18, max:18, block:0, threat:role==='Tank' ? 20 : 0, next: now + 1500 + Math.random()*R.every };
  });
  B = { site:s, g, draw:shuffle(deck.map(c => Object.assign({},c))), hand:[], discard:[], party,
        me:{ id:'me', name:'You', emoji:'🧑‍🎓', role:'You', resolve:RESOLVE, max:RESOLVE, block:0, threat:5 },
        ward: raid ? 0 : WARD_PER_ALLY*party.length, wardMax: raid ? 0 : WARD_PER_ALLY*party.length, rally:0, disrupt:0, surge:2, nextSurge: now + SURGE_MS,
        intent: rollIntent(g), nextStrike: now + STRIKE_MS, nextDraw: now + DRAW_MS, phase: phaseOf(g),
        played:new Set(), spent:0, over:false, handDirty:true, logDirty:true,
        log:[`⚠️ If you lose, every card you played gets tired for ${TIRED_MIN} min, and each has a ${Math.round(BREAK_CHANCE*100)}% chance to break for good. Retreating only tires them.`,
             raid ? `⚔️ You join the ${raid.atk} raid! Its ${party.length} raiders already broke the guardian's ward. Watch out: if one of them lands the final blow, ${raid.atk} rises.` : `⚔️ The siege begins! ${party.length} students answered the call: ${party.map(p => ROLES[p.role].icon+' '+p.role).join(', ')}. The guardian raised a ward of ${WARD_PER_ALLY*party.length} against the crowd.`] };
  for (let k=0;k<HAND_SIZE;k++) drawOne();
  renderBattle(true);
  clearInterval(siegeLoop); siegeLoop = setInterval(siegeTick, 200);
}

function hitGuardian(dmg, src){
  const g = B.g; let soak = 0;
  if (B.ward > 0){ soak = Math.min(B.ward, dmg); B.ward -= soak; }
  g.hp = Math.max(0, g.hp - (dmg - soak));
  const ph = phaseOf(g);
  if (ph > B.phase){ B.phase = ph;
    blog(ph===2 ? `🔥 The ${gName(g.type)} is enraged! It strikes faster and harder.` : `☄️ The ${gName(g.type)} is desperate! Its strikes now hit EVERYONE.`); }
  return soak;
}

function siegeTick(){
  if (!B || B.over){ clearInterval(siegeLoop); return; }
  const now = Date.now(); let changed = false;
  // allies act
  for (const a of B.party){
    if (a.resolve<=0 || now < a.next) continue;
    a.next = now + ROLES[a.role].every*(0.85 + Math.random()*0.3); changed = true;
    if (a.role==='Tank'){ const top = Math.max(...alive().map(p => p.threat)); a.threat = top + 10; a.block += 6; blog(`🛡️ ${a.emoji} ${a.name} taunts the guardian and raises a shield (+6 block).`); }
    else if (a.role==='Healer'){ const t = alive().sort((x,y) => x.resolve/x.max - y.resolve/y.max)[0];
      const h = Math.min(4, t.max - t.resolve); if (h>0){ t.resolve += h; a.threat += 2; blog(`💚 ${a.emoji} ${a.name} heals ${t===B.me ? 'you' : t.name} for ${h}.`); } }
    else if (a.role==='DPS'){ let d = 4 + Math.floor(Math.random()*4) + boostFor(a.type, B.site);
      if (TYPES[a.type].beats===B.g.type) d += 2; a.threat += d;
      const soak = hitGuardian(d, a); blog(`⚔️ ${a.emoji} ${a.name} hits for ${d}${soak ? ` (${soak} into the ward)` : ''}.`);
      if (B.g.hp<=0){ allyWin(a); return; } }
    else if (a.role==='Support'){
      if (!B.disrupt){ B.disrupt = 3; blog(`📣 ${a.emoji} ${a.name} jams the guardian. Its next strike is −3.`); }
      else { B.rally += 3; B.handDirty = true; blog(`📣 ${a.emoji} ${a.name} cheers you on. Your next card hits +3.`); } }
  }
  // guardian strikes
  if (now >= B.nextStrike){
    changed = true;
    const dmg = Math.max(0, B.intent + (B.phase>=2 ? 2 : 0) - B.disrupt); B.disrupt = 0;
    const targets = B.phase===3 ? alive() : [alive().sort((x,y) => y.threat - x.threat)[0]];
    const each = B.phase===3 ? Math.ceil(dmg*0.6) : dmg;
    for (const t of targets){
      const ab = Math.min(t.block, each); t.block -= ab; t.resolve = Math.max(0, t.resolve - (each - ab)); t.threat = Math.floor(t.threat/2);
      blog(`${gEmoji(B.g.type)} The guardian strikes ${t===B.me ? '<b>YOU</b>' : t.emoji+' '+t.name} for ${each}${ab ? ` (${ab} blocked)` : ''}.`);
      if (t!==B.me && t.resolve<=0) blog(`😵 ${t.emoji} ${t.name} is knocked out of the siege.`);
    }
    B.intent = rollIntent(B.g); B.nextStrike = now + (B.phase>=2 ? STRIKE_MS_ENRAGED : STRIKE_MS);
    if (B.me.resolve<=0){ lose('Your resolve breaks.'); return; }
  }
  // battle mana surge
  if (now >= B.nextSurge){ B.nextSurge = now + SURGE_MS; if (B.surge < SURGE_MAX){ B.surge++; B.handDirty = true; changed = true; } }
  // draw
  if (now >= B.nextDraw){ B.nextDraw = now + DRAW_MS; if (B.hand.length < HAND_SIZE){ drawOne(); changed = true; } }
  updateBattle(changed);
}

function memberRow(p){
  const top = alive().sort((x,y) => y.threat - x.threat)[0] === p;
  return `<div style="display:flex;align-items:center;gap:8px;margin:4px 0;${p.resolve<=0?'opacity:.35':''}">
    <span style="font-size:20px;width:26px">${p.emoji}</span>
    <span style="flex:1;font-size:12px"><b>${p===B.me ? 'You' : esc(p.name)}</b> <span class="dim">${p===B.me ? '' : ROLES[p.role].icon+' '+p.role}</span>${top ? ' 🎯' : ''}
      <div class="bar" style="height:5px;margin-top:2px"><i style="width:${100*p.resolve/p.max}%;background:#4cd964"></i></div></span>
    <span style="font-size:11px;width:62px;text-align:right">❤️${p.resolve}${p.block ? ' 🛡️'+p.block : ''}</span></div>`;
}
function renderBattle(full){
  openSheet(`<h2>⚔️ Siege: ${esc(B.site.name)}</h2>
    <div id="bGuard"></div>
    <div class="box" id="bStrike" style="margin-top:8px"></div>
    <div class="box" id="bParty"></div>
    <div class="mstrip" id="bMana" style="border-radius:10px;margin-top:6px"></div>
    <div class="hand" id="bHand"></div>
    <div class="wheel" id="bDeck"></div>
    <div class="log" id="bLog"></div>
    <div class="row"><button data-act="retreat">🏳️ Retreat</button></div>`, true);
  updateBattle(true);
}
function updateBattle(changed){
  const $ = id => document.getElementById(id); if (!$('bStrike')) return;
  const g = B.g, secs = Math.max(0, Math.ceil((B.nextStrike - Date.now())/1000)), top = alive().sort((x,y) => y.threat - x.threat)[0];
  const dmg = Math.max(0, B.intent + (B.phase>=2 ? 2 : 0) - B.disrupt);
  $('bStrike').innerHTML = `${B.phase===3 ? '☄️' : '🗡️'} Next strike in <b>${secs}s</b>: <b>${B.phase===3 ? Math.ceil(dmg*0.6)+' to everyone' : dmg+' at '+(top===B.me ? 'YOU' : top.emoji+' '+esc(top.name))}</b>
    ${B.disrupt ? ` <span class="boost">(jammed −${B.disrupt})</span>` : ''}${B.phase===2 ? ' <span style="color:#ff9b5e">🔥 enraged</span>' : ''}
    <div class="bar" style="margin-top:6px"><i style="width:${100*secs*1000/(B.phase>=2?STRIKE_MS_ENRAGED:STRIKE_MS)}%;background:#ff9b5e"></i></div>`;
  if (!changed) return;
  $('bGuard').innerHTML = guardianPanel(B.site, g) + (B.wardMax ? `<div style="font-size:12px;margin-top:4px">🔰 Crowd ward ${B.ward}/${B.wardMax}<div class="bar" style="height:5px"><i style="width:${100*B.ward/B.wardMax}%;background:#9ecbff"></i></div></div>` : '');
  $('bParty').innerHTML = `<div class="dim" style="font-size:11px;margin-bottom:2px">SIEGE PARTY · 🎯 = the guardian's current target</div>` + [B.me, ...B.party].map(memberRow).join('');
  $('bMana').innerHTML = document.getElementById('manaStrip').innerHTML + `<span style="--tc:#ffd84d" title="Battle mana: pays for any card in this siege">⚡${B.surge}</span>`;
  $('bDeck').textContent = `⚡ Battle mana +1 every ${SURGE_MS/1000}s (max ${SURGE_MAX}) · draw a card every ${DRAW_MS/1000}s · deck ${B.draw.length}`;
  if (B.handDirty){ B.handDirty = false;
    $('bHand').innerHTML = B.hand.map((c,k) => cardHTML(c,{ eff:effPow(c)+B.rally, cls: canPay(c) ? 'pickable' : 'cant', attr:`data-act="play" data-arg="${k}"` })).join('') || '<p class="dim">Drawing…</p>'; }
  if (B.logDirty){ B.logDirty = false; $('bLog').innerHTML = B.log.slice(0,10).map(l => `<div>${l.replace(/<(?!\/?b>)/g,'&lt;')}</div>`).join(''); }
}
function playCard(k){
  if (B.over) return; const c = B.hand[k]; if (!c) return;
  if (!canPay(c)) return toast(`Needs ${c.cost} ${c.type} mana (colorless ◇ can cover the gap).`);
  const usedC = pay(c.type, c.cost); B.spent += c.cost; B.played.add(c.uid);
  const d = effPow(c) + B.rally; B.rally = 0; B.me.threat += d;
  const soak = hitGuardian(d, B.me);
  let line = `${c.emoji} You play ${esc(c.name)}: ${d} damage${soak ? ` (${soak} into the ward)` : ''}${usedC ? ` (◇${usedC} colorless)` : ''}`;
  if (TYPES[c.type].beats===B.g.type){ B.disrupt += 2; line += ', super effective (next strike −2)'; }
  if (c.ab==='Guard'){ const b = Math.ceil(c.pow/2); B.me.block += b; B.me.threat += 15; line += `, 🛡️ +${b} block and you taunt`; }
  if (c.ab==='Mend'){ const t = alive().sort((x,y) => x.resolve/x.max - y.resolve/y.max)[0]; const h = Math.min(3, t.max - t.resolve); t.resolve += h; line += `, 💚 heals ${t===B.me ? 'you' : t.name} ${h}`; }
  if (c.ab==='Rally'){ B.rally = 3; line += ', 📣 your next card +3'; }
  B.hand.splice(k,1); B.discard.push(c); B.handDirty = true;
  if (c.ab==='Swift'){ drawOne(); line += ', ⚡ drew a card'; }
  blog(line); save();
  if (B.g.hp<=0) return win(c);
  updateBattle(true);
}
function allyWin(a){
  B.over = true; clearInterval(siegeLoop); const s = B.site, old = B.g; delete S.raids[s.id];
  if (s.id==='tower'){ old.beaten = a.type; const lost = S.artifact && S.artifact.holder==='you'; S.artifact = { holder:a.type, since:Date.now() };
    news(`🔔 In your siege, ${a.name} (${a.type}) landed the final blow on the Bell Warden. ${a.type} students now hold the Carillon${lost ? ', taken from YOU' : ''}.`); }
  else { delete S.guardians[s.id];
    const empties = SITES.filter(x => !S.guardians[x.id] && x.id!==s.id), home = empties.filter(x => x.aff===a.type), dest = pick(Math.random, home.length ? home : empties);
    S.guardians[dest.id] = makeGuardian(a.type, 'rival', 1);
    news(`⚔️ Your siege toppled the ${old.type} guardian at ${s.name}, but ${a.name} landed the final blow. A ${a.type} ${gName(a.type)} rose at ${dest.name}.`); }
  save(); renderSites(); updateBanner();
  openSheet(`<h2>🤝 The siege succeeded, but not by your hand</h2>
    <p>${a.emoji} <b>${esc(a.name)}</b> (${ROLES[a.role].icon} ${a.role}, ${T(a.type).icon} ${a.type}) landed the final blow, so the summon goes to <b>${a.type}</b>${s.id==='tower' ? ', along with the Carillon' : ''}.</p>
    <p class="dim">Your cards aren't tired, since your side won. Next time, watch the guardian's HP and save a strong card for the last hit.</p>
    <div class="row"><button class="primary" data-act="close">Back to map</button></div>`);
}

function lose(why, retreat){
  B.over = true; clearInterval(siegeLoop); B.g.upd = Date.now();
  const broken = [], tired = [];
  for (const uid of B.played){ const c = S.cards.find(x => x.uid===uid); if (!c) continue;
    if (!retreat && Math.random() < (c.rar>=2 ? BREAK_CHANCE_RARE : BREAK_CHANCE)){
      broken.push(c); S.cards = S.cards.filter(x => x.uid!==uid); S.deck = S.deck.filter(u => u!==uid); delete S.tired[uid]; }
    else { S.tired[uid] = Date.now() + TIRED_MIN*60000; tired.push(c); } }
  if (broken.length) news(`💔 ${broken.map(c => c.emoji+' '+c.name).join(', ')} broke in the fight at ${B.site.name}.`);
  save(); renderSites();
  openSheet(`<h2>🏳️ ${why}</h2>
    <p><b>Cost:</b> the ${B.spent||0} mana you spent is gone.</p>
    ${tired.length ? `<p>😴 <b>Tired for ${TIRED_MIN} min:</b> ${tired.map(c => c.emoji+' '+esc(c.name)).join(', ')}. They sit out fights until they rest.</p>` : ''}
    ${broken.length ? `<div class="box" style="border:2px solid #e0524c">💔 <b>Broken forever:</b><div class="reveal">${broken.map(c => cardHTML(c,{cls:'tired'})).join('')}</div><p class="dim" style="margin-bottom:0">Watch for packs to rebuild your deck.</p></div>`
      : !retreat && tired.length ? '<p class="dim">Lucky: none of your cards broke this time.</p>' : ''}
    <p>The ${gName(B.g.type)} keeps its wounds: ❤️ ${B.g.hp}/${B.g.maxHp}. It heals ${GUARDIAN_REGEN} every ${GUARDIAN_REGEN_MIN} min, so come back soon with more mana, or bring friends.</p>
    <div class="row"><button class="primary" data-act="close">Back to map</button></div>`);
}
let pendingSummon = null;
function win(final){
  B.over = true; clearInterval(siegeLoop); delete S.raids[B.site.id]; const s = B.site, old = B.g;
  if (s.id==='tower'){
    old.beaten = 'you'; const had = S.artifact && S.artifact.holder; S.artifact = { holder:'you', since:Date.now() };
    const grant = Math.min(ARTIFACT_GRANT, COLORLESS_MAX - S.mana.Colorless); S.mana.Colorless += grant;
    const trophy = addCard(makeCard(rngFrom('bell|'+Date.now()), pick(Math.random,TYPE_KEYS), 2), 'the Bell Warden');
    news(`🔔 You toppled the Bell Warden at Elliott Tower and claimed the Carillon${had && had!=='you' ? ' from '+had+' students' : ''}!`);
    save(); renderSites(); updateBanner();
    openSheet(`<h2>🔔 The Carillon is yours!</h2>
      <p>◇ +${grant} colorless mana. While you hold the Carillon, every well also gives you ◇ +${ARTIFACT_WELL_BONUS}. Colorless mana pays for any faction's cards.</p>
      <p class="dim">You hold it until someone topples the next Bell Warden. Watch for the bells.</p>
      <div class="reveal">${cardHTML(trophy)}</div><div class="row"><button class="primary" data-act="close">Ring it</button></div>`);
    return; }
  delete S.guardians[s.id]; S.toppled++;
  const trophy = addCard(makeCard(rngFrom('trophy|'+s.id+'|'+Date.now()), old.type, 2), 'toppling the guardian at '+s.name);
  news(`⚔️ You toppled the ${old.type} ${gName(old.type)} at ${s.name} with ${final.emoji} ${final.name}.`);
  pendingSummon = { type:final.type, rar:final.rar, from:s.id }; save(); renderSites();
  const empties = SITES.filter(x => !S.guardians[x.id] && x.id!==s.id)
    .sort((a,b) => (b.aff===final.type) - (a.aff===final.type) || distM(s.lat,s.lng,a.lat,a.lng) - distM(s.lat,s.lng,b.lat,b.lng));
  const best = empties[0], lvl = x => Math.min(3, 1 + (final.rar>=2?1:0) + (x.aff===final.type?1:0));
  const seatBtn = x => `<button style="--tc:${x.aff ? TYPES[x.aff].color : '#777'}" data-act="summon" data-arg="${x.id}">
      <span style="font-size:22px">${x.aff===final.type ? '🏠' : '⛲'}</span><span><b>${esc(x.name)}</b> · Lv ${lvl(x)}<br><span class="dim" style="font-size:12px">${x.aff ? x.aff+' turf' : 'Commons'} · ${fmtDist(distM(s.lat,s.lng,x.lat,x.lng))} from here</span></span></button>`;
  openSheet(`<h2>🏆 Guardian toppled!</h2>
    <div class="gpanel" style="--tc:${TYPES[trophy.type].color}"><div class="big" style="font-size:38px">${trophy.emoji}</div><div class="info">
      <b>Trophy: ${esc(trophy.name)}</b><br><span class="dim" style="font-size:12px">${RARITY[trophy.rar]} ${trophy.type} card, added to your collection</span></div></div>
    <div class="box" style="margin-top:12px;border:2px solid ${TYPES[final.type].color}">
      <p style="margin-top:0">Your final blow was ${final.emoji} <b>${TYPES[final.type].icon} ${final.type}</b>, so a <b>${gName(final.type)}</b> answers your call. ${esc(s.name)} now stands empty.</p>
      <p><b>One last step: choose where your guardian rises.</b></p>
      <button class="primary" style="width:100%;padding:12px" data-act="summon" data-arg="${best.id}">${gEmoji(final.type)} Summon at ${esc(best.name)} (Lv ${lvl(best)})</button>
      <p class="dim" style="font-size:12px;margin-bottom:0">${best.aff===final.type ? `That's ${final.type} home turf, which gives your guardian +1 level.` : 'That is the closest empty seat.'}</p></div>
    <p class="dim">Or choose another empty seat:</p>
    <div class="glist">${empties.slice(1,4).map(seatBtn).join('')}</div>
    ${empties.length>4 ? `<details><summary class="dim" style="padding:8px 0;cursor:pointer">Show all ${empties.length} empty seats</summary><div class="glist">${empties.slice(4).map(seatBtn).join('')}</div></details>` : ''}`, true);
}
function summon(id){
  if (!pendingSummon) return; const { type, rar } = pendingSummon, s = siteById(id);
  const level = Math.min(3, 1 + (rar>=2?1:0) + (s.aff===type?1:0));
  S.guardians[id] = makeGuardian(type, 'you', level); S.summoned++; pendingSummon = null;
  news(`👑 You summoned a ${type} ${gName(type)} (Lv ${level}) at ${s.name}. ${type} cards now hit harder across campus.`);
  save(); renderSites(); renderPacks(); updateBanner(); closeSheet();
  map.setView([s.lat,s.lng], 18); toast(`👑 Your ${gName(type)} guards ${s.name}!`);
}

function toggleDeck(uid){ const k = S.deck.indexOf(uid);
  if (k>=0) S.deck.splice(k,1); else if (S.deck.length<DECK_MAX) S.deck.push(uid); else return toast(`Decks hold ${DECK_MAX} cards. Remove one first.`);
  save(); renderCards(); cardDetail(uid); }
function cardDetail(uid){
  const c = S.cards.find(x => x.uid===uid); if (!c) return; const l = cardLore(c), inDeck = S.deck.includes(uid), tl = tiredLeft(uid);
  openSheet(`<div class="reveal">${cardHTML(c,{ tired:tl, cls:tl?'tired':'' })}</div>
    ${l ? `<p class="flavor" style="text-align:center">“${esc(l.text)}”${l.link ? `<br><a href="${l.link}" target="_blank" rel="noopener" style="color:#8cc8ff;font-style:normal">Source →</a>` : ''}</p>` : ''}
    <p class="dim" style="text-align:center">${RARITY[c.rar]} ${c.type} · costs ${c.cost} ${c.type} mana · found in ${esc(c.origin||'?')}</p>
    ${c.ab ? `<p style="text-align:center">${ABIL[c.ab].icon} <b>${c.ab}</b>: ${ABIL[c.ab].text}</p>` : ''}

function autoDeck(){ // favor the faction you hold most of, then efficiency

  if (m==='gps'){
    if (!navigator.geolocation || !window.isSecureContext){ toast('Location needs HTTPS. Using test mode.'); return setMode('test'); }
    watchId = navigator.geolocation.watchPosition(p => { if (S.mode==='gps'){ const first = !me; setPos(p.coords.latitude,p.coords.longitude); if (first) map.setView([me.lat,me.lng],18); } },
      err => { toast('Location unavailable ('+err.message+'). Switched to test mode.'); setMode('test'); },
      { enableHighAccuracy:true, maximumAge:5000, timeout:20000 });
  } else { if (!me || !inCampus(me.lat,me.lng)) setPos(...CAMPUS.center); toast('Tap anywhere on the map to walk there.'); }
  updateBanner();
}

/* =====================================================================
   UI PLUMBING
   ===================================================================== */
let sheetLocked = false;
function openSheet(html, locked=false){ sheetLocked = locked; document.getElementById('sheet').innerHTML = html; document.getElementById('modal').hidden = false; }
function closeSheet(){ sheetLocked = false; document.getElementById('modal').hidden = true; }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id==='modal' && !sheetLocked) closeSheet(); });
const ACT = {
  close: closeSheet, well: drawMana, tend, challenge: id => challenge(id), play: k => playCard(+k),
  retreat: () => lose('You retreat.', true), summon, movesite: moveSite, copysites: copySites,
  editor: () => { S.editor = !S.editor; save(); showHelp(); }, reset: (a,btn) => resetGame(btn),
  autodeck: autoDeck, cleardeck: () => { S.deck = []; save(); renderCards(); },
  filter: t => { cardFilter = t; renderCards(); }, toggledeck: u => toggleDeck(+u), carddetail: u => cardDetail(+u),
  history: () => openSheet(HISTORY_HTML + '<div class="row"><button class="primary" data-act="close">Close</button></div>'),
  fly: id => { const s = siteById(id); showTab('Map'); map.setView([s.lat,s.lng],18); openSite(id); },
};
document.body.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) f(b.dataset.arg, b); });
let toastT; function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }
function showTab(t){
  ['Map','Cards','News','Help'].forEach(x => document.getElementById('tab'+x).classList.toggle('on', x===t));
  document.getElementById('cardsPage').hidden = t!=='Cards'; document.getElementById('newsPage').hidden = t!=='News';
  if (t==='Cards') renderCards(); if (t==='News') renderNews(); if (t==='Help') showHelp(); if (t==='Map') map.invalidateSize();
}
['Map','Cards','News','Help'].forEach(t => document.getElementById('tab'+t).onclick = () => showTab(t));
document.getElementById('modeBtn').onclick = () => setMode(S.mode==='gps' ? 'test' : 'gps');
document.getElementById('centerBtn').onclick = () => me ? map.setView([me.lat,me.lng],18) : map.setView(CAMPUS.center,17);

function heartbeat(){
  const before = JSON.stringify(S.guardians);
  regenGuardians(); manaRegen(); processRaids(); if (!(B && !B.over)) rivalCatchUp(); prunePacks();
  for (const u in S.tired) if (!tiredLeft(u)) delete S.tired[u];
  save(); renderSites();
  renderPacks(); updateBanner(); hud();
  if (!document.getElementById('newsPage').hidden) renderNews();
}

/* =====================================================================
   BOOT
   ===================================================================== */
(function init(){
  load(); buildSites();
  if (!S.started){
    const r = rngFrom('starter|'+Date.now());
    TYPE_KEYS.forEach(t => addCard(makeCard(r,t,0),'starter pack')); addCard(makeCard(r,pick(r,TYPE_KEYS),1),'starter pack');
    seedGuardians(); S.lastTick = Date.now(); S.started = true;
    news(`🌅 ${MAX_GUARDIANS} guardians have risen on campus: ${guardianList().map(x => x.g.type+' at '+x.site.name).join(', ')}.`);
  }
  save(); renderSites(); setMode(S.mode); heartbeat();
  setInterval(heartbeat, 15000);
  if (!S.seenHelp) showHelp();
})();
</script>
